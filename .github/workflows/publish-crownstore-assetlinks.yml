name: Publish CrownStore WebAuthn association

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crownstore-android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected CrownStore branch
        uses: actions/checkout@v4

      - name: Set up Java for keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check release-signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS" && test -n "$KSP" && test -n "$ALIAS" || {
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS to CrownStore Actions secrets."
            exit 1
          }

      - name: Generate the CrownStore-only Digital Asset Links file
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ runner.temp }}/crownstore-release.keystore
        run: |
          set -euo pipefail
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          CERT_SHA256="$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 -binary | od -An -v -tx1 | tr -d ' \n' | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
          ANDROID_KEY_HASH="$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          test -n "$CERT_SHA256" && test -n "$ANDROID_KEY_HASH"
          export CERT_SHA256
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          fingerprint = os.environ["CERT_SHA256"].strip().upper()
          if not re.fullmatch(r"(?:[0-9A-F]{2}:){31}[0-9A-F]{2}", fingerprint):
              raise SystemExit("The CrownStore signing-certificate fingerprint is invalid.")
          path = Path("public/.well-known/assetlinks.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          data = [
              {
                  "relation": [
                      "delegate_permission/common.handle_all_urls",
                      "delegate_permission/common.get_login_creds"
                  ],
                  "target": {
                      "namespace": "android_app",
                      "package_name": "online.kingshall.crownstore",
                      "sha256_cert_fingerprints": [fingerprint]
                  }
              },
              {
                  "relation": ["delegate_permission/common.get_login_creds"],
                  "target": {
                      "namespace": "web",
                      "site": "https://crownstore.kingshall.online"
                  }
              }
          ]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          {
            echo "### CrownStore WebAuthn association"
            echo ""
            echo "- Set ApiCrownStore Render `WEBAUTHN_ANDROID_ORIGIN` to:"
            echo ""
            echo "  `android:apk-key-hash:$ANDROID_KEY_HASH`"
            echo ""
            echo "- RP ID: `crownstore.kingshall.online`"
            echo "- Certificate fingerprint: `$CERT_SHA256`"
            echo "- This workflow does not build or publish an APK and does not modify KingsHall, CryBots or HallsChat."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CROWNSTORE_ANDROID_KEY_HASH=$ANDROID_KEY_HASH" >> "$GITHUB_ENV"

      - name: Commit the association file to the selected branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow from a branch, normally main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "CrownStore Digital Asset Links already matches the release-signing certificate."
          else
            git commit -m "Publish CrownStore WebAuthn association"
            git push origin "HEAD:$REF_NAME"
          fi
