name: Build CrownStore Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Serialize manual release builds so duplicate clicks cannot race versioning or publishing.
concurrency:
  group: crownstore-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Choose next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease > releases.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          releases=json.loads(Path("releases.json").read_text())
          versions=[]
          for r in releases:
              m=re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)",r.get("tagName",""))
              if m and not r.get("isDraft") and not r.get("isPrerelease"):
                  versions.append(tuple(map(int,m.groups())))
          if not versions:
              v=(1,0,0)
          else:
              major,minor,patch=max(versions)
              # CrownStore release trains use patches 0-9; after .9, advance the minor.
              # This deliberately skips the accidental 1.0.10 line and selects 1.1.0.
              if patch >= 9:
                  v=(major,minor+1,0)
              else:
                  v=(major,minor,patch+1)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("app_version="+".".join(map(str,v))+"\n")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install web, Android and icon dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false @capacitor/assets@3.0.5 @capacitor/splash-screen@7.0.3 sharp

      - name: Build web/PWA
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/variables.gradle")
          s,n=re.subn(r"(?m)^(\s*compileSdkVersion\s*=\s*)\d+\s*$",r"\g<1>35",p.read_text(),count=1)
          if n!=1: raise SystemExit("Could not set compileSdkVersion=35.")
          p.write_text(s)
          PY

      - name: Generate CrownStore icon resources
        run: |
          mkdir -p assets
          # Keep the launcher icon source separate from the native launch-splash artwork.
          cp public/crownstore-app-icon.svg assets/icon.svg
          cp public/crownstore-pwa-icon.svg assets/splash.svg
          npx capacitor-assets generate --android

      - name: Sync native plugin and deep link
        run: |
          npx cap sync android
          python3 scripts/install-android-device-bridge.py

      - name: Match CrownStore APK launcher icons to the HallsChat structure
        env:
          APP_ICON_SVG: public/crownstore-app-icon.svg
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          (async () => {
            const svgPath = process.env.APP_ICON_SVG;
            const svg = fs.readFileSync(svgPath);
            const densities = {
              'mipmap-mdpi': { icon: 48, foreground: 108 },
              'mipmap-hdpi': { icon: 72, foreground: 162 },
              'mipmap-xhdpi': { icon: 96, foreground: 216 },
              'mipmap-xxhdpi': { icon: 144, foreground: 324 },
              'mipmap-xxxhdpi': { icon: 192, foreground: 432 }
            };
            const root = 'android/app/src/main/res';
            for (const [folder, sizes] of Object.entries(densities)) {
              const dir = path.join(root, folder);
              if (!fs.existsSync(dir)) {
                throw new Error('Expected generated Android icon directory is missing: ' + dir);
              }
              for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
                await sharp(svg).resize(sizes.icon, sizes.icon).png()
                  .toFile(path.join(dir, name));
              }
              await sharp(svg).resize(sizes.foreground, sizes.foreground).png()
                .toFile(path.join(dir, 'ic_launcher_foreground.png'));
            }
            for (const name of ['ic_launcher.xml', 'ic_launcher_round.xml']) {
              const xmlPath = path.join(root, 'mipmap-anydpi-v26', name);
              if (!fs.existsSync(xmlPath)) {
                throw new Error('Expected adaptive launcher resource is missing: ' + xmlPath);
              }
              const xml = fs.readFileSync(xmlPath, 'utf8');
              if (!xml.includes('@mipmap/ic_launcher_foreground')) {
                throw new Error(name + ' does not reference the foreground icon being updated.');
              }
            }
            console.log('Replaced CrownStore APK launcher icon PNGs and adaptive foregrounds using the HallsChat resource layout; splash resources were not changed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Configure unified CrownStore native launch splash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/values android/app/src/main/res/values-v31

          # Match the shared KingsHall APK splash composition on every Android version:
          # 92dp circular holder, 72dp visible artwork, centered on a transparent square canvas.
          # Keep CrownStore's cart/crown mark and outer splash background; only the holder is black
          # with a subtle neutral edge, matching the other apps' circular-holder treatment.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          marker = "dependencies {"
          dependency = 'implementation "androidx.core:core-splashscreen:1.0.1"'
          if dependency not in text:
              if marker not in text:
                  raise SystemExit("Could not find Android dependencies block for SplashScreen.")
              offset = text.index(marker) + len(marker)
              text = text[:offset] + "\n    " + dependency + text[offset:]
              path.write_text(text)
          PY

          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          (async () => {
            const master = fs.readFileSync('public/crownstore-pwa-icon.svg', 'utf8');
            const defsStart = master.indexOf('<defs>');
            const defsEnd = master.indexOf('</defs>', defsStart);
            const artworkStart = master.indexOf('<g transform="translate(37.5 58.75) scale(1.25)"');
            const artworkEnd = master.indexOf('</g>', artworkStart);
            if (defsStart < 0 || defsEnd < 0 || artworkStart < 0 || artworkEnd < 0) {
              throw new Error('CrownStore master SVG changed; cannot safely isolate the cart/crown splash artwork.');
            }
            const defs = master.slice(defsStart, defsEnd + '</defs>'.length);
            const artworkGroup = master.slice(artworkStart, artworkEnd + '</g>'.length);

            // Crop to the actual cart/crown artwork so its visible scale matches the other APKs,
            // instead of scaling the full PWA icon (which also contains its square canvas and circle).
            const artworkSvg = Buffer.from(
              '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="137 114.5 500 500">' +
              defs + artworkGroup + '</svg>'
            );

            const background = '#100719';
            const circleFill = '#090510';
            const circleStroke = '#241038';
            const legacyCanvasPx = 512;
            const legacyHolderDp = 92;
            const artworkDp = 72;
            const legacyArtworkPx = Math.round(legacyCanvasPx * artworkDp / legacyHolderDp * 500 / 454);
            const systemCanvasPx = 512;
            const systemCanvasDp = 288;
            const systemHolderPx = Math.round(legacyHolderDp / systemCanvasDp * systemCanvasPx);
            const systemArtworkPx = Math.round(artworkDp / systemCanvasDp * systemCanvasPx * 500 / 454);

            if (systemHolderPx !== 164 || systemArtworkPx !== 141 || legacyArtworkPx !== 441) {
              throw new Error('CrownStore splash dimensions no longer match the shared 92dp holder / 72dp artwork system.');
            }

            const legacyCircleSvg = Buffer.from(
              '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">' +
              '<circle cx="256" cy="256" r="253" fill="' + circleFill + '" stroke="' + circleStroke + '" stroke-width="4"/>' +
              '</svg>'
            );
            const legacyCircle = await sharp(legacyCircleSvg).png().toBuffer();
            const legacyArtwork = await sharp(artworkSvg).resize(legacyArtworkPx, legacyArtworkPx, { fit: 'contain' }).png().toBuffer();
            await sharp({
              create: { width: legacyCanvasPx, height: legacyCanvasPx, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } }
            }).composite([
              { input: legacyCircle, left: 0, top: 0 },
              { input: legacyArtwork, left: Math.round((legacyCanvasPx - legacyArtworkPx) / 2), top: Math.round((legacyCanvasPx - legacyArtworkPx) / 2) }
            ]).png().toFile('android/app/src/main/res/drawable-nodpi/crownstore_splash_logo.png');

            const systemCircleSvg = Buffer.from(
              '<svg xmlns="http://www.w3.org/2000/svg" width="' + systemHolderPx + '" height="' + systemHolderPx + '" viewBox="0 0 ' + systemHolderPx + ' ' + systemHolderPx + '">' +
              '<circle cx="' + (systemHolderPx / 2) + '" cy="' + (systemHolderPx / 2) + '" r="' + (systemHolderPx / 2 - 1) + '" fill="' + circleFill + '" stroke="' + circleStroke + '" stroke-width="2"/>' +
              '</svg>'
            );
            const systemCircle = await sharp(systemCircleSvg).png().toBuffer();
            const systemArtwork = await sharp(artworkSvg).resize(systemArtworkPx, systemArtworkPx, { fit: 'contain' }).png().toBuffer();
            await sharp({
              create: { width: systemCanvasPx, height: systemCanvasPx, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } }
            }).composite([
              { input: systemCircle, left: Math.round((systemCanvasPx - systemHolderPx) / 2), top: Math.round((systemCanvasPx - systemHolderPx) / 2) },
              { input: systemArtwork, left: Math.round((systemCanvasPx - systemArtworkPx) / 2), top: Math.round((systemCanvasPx - systemArtworkPx) / 2) }
            ]).png().toFile('android/app/src/main/res/drawable-nodpi/crownstore_splash_logo_v31.png');

            const branding = Buffer.from(
              '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">' +
              '<rect width="800" height="320" fill="none"/>' +
              '<text x="400" y="174" text-anchor="middle" fill="#ddd6fe" font-family="STIX Two Text, serif" font-size="72" font-weight="700" letter-spacing="3">CrownStore</text>' +
              '</svg>'
            );
            await sharp(branding).png().toFile('android/app/src/main/res/drawable-nodpi/crownstore_branding.png');

            const auditLegacy = await sharp('android/app/src/main/res/drawable-nodpi/crownstore_splash_logo.png').ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const auditSystem = await sharp('android/app/src/main/res/drawable-nodpi/crownstore_splash_logo_v31.png').ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const alphaAt = (audit, x, y) => audit.data[(y * audit.info.width + x) * audit.info.channels + 3];
            if (auditLegacy.info.width !== 512 || auditLegacy.info.height !== 512 ||
                alphaAt(auditLegacy, 0, 0) !== 0 || alphaAt(auditLegacy, 256, 256) === 0 ||
                auditSystem.info.width !== 512 || auditSystem.info.height !== 512 ||
                alphaAt(auditSystem, 0, 0) !== 0 || alphaAt(auditSystem, 256, 256) === 0) {
              throw new Error('CrownStore splash image failed size, transparency, or center-art validation.');
            }
            console.log('Created and validated CrownStore splash: 92dp circle holder + 72dp visible cart/crown artwork on legacy Android and Android 12+.');
            console.log('CrownStore native splash background: ' + background);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          cat > android/app/src/main/res/drawable/crownstore_launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/crownstore_splash_background" />
              <item
                  android:width="92dp"
                  android:height="92dp"
                  android:gravity="center"
                  android:drawable="@drawable/crownstore_splash_logo" />
              <item
                  android:width="160dp"
                  android:height="64dp"
                  android:gravity="center|bottom"
                  android:bottom="51dp"
                  android:drawable="@drawable/crownstore_branding" />
          </layer-list>
          XML

          cat > android/app/src/main/res/values/crownstore_splash_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="crownstore_splash_background">#100719</color>
          </resources>
          XML

          cat > android/app/src/main/res/values-v31/crownstore_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowSplashScreenBackground">@color/crownstore_splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/crownstore_splash_logo_v31</item>
                  <item name="android:windowSplashScreenBrandingImage">@drawable/crownstore_branding</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/res/values/styles.xml")
          text = path.read_text()
          name_index = text.find('name="AppTheme.NoActionBarLaunch"')
          start = text.rfind("<style", 0, name_index) if name_index >= 0 else -1
          close = text.find("</style>", name_index) if name_index >= 0 else -1
          if start < 0 or close < 0:
              raise SystemExit("Could not find Capacitor AppTheme.NoActionBarLaunch in values/styles.xml")
          replacement = """<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:windowBackground">@drawable/crownstore_launch_background</item>
              <item name="windowSplashScreenBackground">@color/crownstore_splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/crownstore_splash_logo</item>
              <item name="android:windowSplashScreenBrandingImage">@drawable/crownstore_branding</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
          </style>"""
          close += len("</style>")
          path.write_text(text[:start] + replacement + text[close:])
          PY

      - name: Set Android version
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path("android/app/build.gradle"); s=p.read_text()
          s,n1=re.subn(r"(?m)^\s*versionCode\s+\d+\s*$",f"        versionCode {int(os.environ['APP_VERSION_CODE'])}",s,count=1)
          s,n2=re.subn(r'''(?m)^\s*versionName\s+["'][^"']*["']\s*$''',f'versionName "{os.environ["APP_VERSION"]}"',s,count=1)
          if n1!=1 or n2!=1: raise SystemExit("Could not set Android version.")
          p.write_text(s)
          PY

      - name: Check release signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$KSP" && test -n "$ALIAS" && test -n "$KP" || {
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to Actions secrets."
            exit 1
          }

      - name: Configure persistent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/crownstore-release.keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle"); s=p.read_text()
          if "signingConfigs {" in s: raise SystemExit("Signing config already exists.")
          marker="    buildTypes {"
          if marker not in s: raise SystemExit("Could not find Android buildTypes block.")
          signing="""    signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          s=s.replace(marker,signing+marker,1); b=s.index(marker); idx=s.find("release {",b)
          if idx<0: raise SystemExit("Could not find release build type.")
          end=s.find("\n",idx)+1; s=s[:end]+"            signingConfig signingConfigs.release\n"+s[end:]; p.write_text(s)
          PY

      - name: Publish CrownStore WebAuthn signing configuration
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/crownstore-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          CERT_SHA256="$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | openssl dgst -sha256 -binary | od -An -v -tx1 | tr -d ' \n' | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
          ANDROID_KEY_HASH="$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          test -n "$CERT_SHA256"
          test -n "$ANDROID_KEY_HASH"
          echo "CROWNSTORE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "CROWNSTORE_ANDROID_KEY_HASH=$ANDROID_KEY_HASH" >> "$GITHUB_ENV"
          {
            echo "### CrownStore-owned WebAuthn configuration"
            echo ""
            echo "- Set `WEBAUTHN_ANDROID_ORIGIN` on the ApiCrownStore Render service to:"
            echo ""
            echo "  `android:apk-key-hash:$ANDROID_KEY_HASH`"
            echo ""
            echo "- The next step publishes the matching signing-certificate fingerprint at CrownStore's own `/.well-known/assetlinks.json`."
            echo "- CrownStore's passkey RP ID is `crownstore.kingshall.online`; this does not change KingsHall, CryBots or HallsChat configuration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build production APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/crownstore-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Verify, checksum and publish release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk CrownStore.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CrownStore.apk
          sha256sum CrownStore.apk > CrownStore.apk.sha256
          gh release create "v$APP_VERSION" CrownStore.apk CrownStore.apk.sha256 --target "$GITHUB_SHA" --title "CrownStore $APP_VERSION" --notes "CrownStore Android production APK $APP_VERSION. Android will ask the user to approve installation."

      - name: Publish CrownStore Digital Asset Links association
        if: ${{ steps.publish_release.outcome == 'success' }}
        env:
          CERT_SHA256: ${{ env.CROWNSTORE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          fingerprint = os.environ["CERT_SHA256"].strip().upper()
          if not re.fullmatch(r"(?:[0-9A-F]{2}:){31}[0-9A-F]{2}", fingerprint):
              raise SystemExit("The CrownStore signing-certificate fingerprint is invalid.")
          path = Path("public/.well-known/assetlinks.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          statements = [
              {
                  "relation": [
                      "delegate_permission/common.handle_all_urls",
                      "delegate_permission/common.get_login_creds"
                  ],
                  "target": {
                      "namespace": "android_app",
                      "package_name": "online.kingshall.crownstore",
                      "sha256_cert_fingerprints": [fingerprint]
                  }
              },
              {
                  "relation": ["delegate_permission/common.get_login_creds"],
                  "target": {
                      "namespace": "web",
                      "site": "https://crownstore.kingshall.online"
                  }
              }
          ]
          path.write_text(json.dumps(statements, indent=2) + "\\n", encoding="utf-8")
          print("Generated CrownStore-only Digital Asset Links for online.kingshall.crownstore.")
          PY

          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "::error::Run this manual release workflow from a branch so its CrownStore asset-link update can be committed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update CrownStore Digital Asset Links signing fingerprint"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "CrownStore Digital Asset Links already matches this signing certificate."
          fi

      - name: Notify ApiCrownStore about the published APK release
        if: ${{ always() && steps.publish_release.outcome == 'success' }}
        env:
          API_URL: ${{ vars.CROWNSTORE_API_URL || 'https://apicrownstore.kingshall.online' }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub Actions OIDC is unavailable. Ensure this workflow has id-token: write permission."
            exit 1
          fi

          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --header "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapicrownstore.kingshall.online")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "v$APP_VERSION" \
            '{action:"published",repository:{full_name:$repository},release:{tag_name:$tag,draft:false,prerelease:false}}')"

          for attempt in 1 2 3 4 5; do
            if curl --connect-timeout 15 --max-time 40 --fail-with-body --silent --show-error \
              --request POST "$API_URL/api/webhooks/github/release" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Event: release" \
              --header "X-GitHub-Delivery: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
              --header "Authorization: Bearer $oidc_token" \
              --data "$payload"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "::error::APK release was published, but ApiCrownStore synchronization failed after 5 attempts."
          exit 1

