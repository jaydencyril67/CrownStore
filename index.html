<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0c" />
    <meta name="description" content="Discover, inspect and download official Android applications from the KingsHall ecosystem." />
    <meta name="color-scheme" content="dark" />
    <link rel="preload" href="/fonts/STIXTwoText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/STIXTwoText-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <title>CrownStore — Official KingsHall App Store</title>
    <style>
      #crownstore-refresh-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 75% 10%,rgba(109,40,217,.22),transparent 38%),radial-gradient(ellipse at 15% 85%,rgba(76,29,149,.16),transparent 42%),linear-gradient(180deg,#100713 0%,#0e0718 48%,#08040f 100%);color:#f4efff}
      #crownstore-refresh-splash .splash-content{display:flex;flex-direction:column;align-items:center;gap:17px;text-align:center}
      #crownstore-refresh-splash .splash-logo-circle{display:grid;place-items:center;width:92px;height:92px;flex:0 0 92px;box-sizing:border-box;border:1.5px solid rgba(237,224,255,.72);border-radius:50%;background:radial-gradient(ellipse at 0 0,rgba(255,255,255,.105),transparent 55%),linear-gradient(145deg,rgba(109,40,217,.28),rgba(10,5,20,.84));box-shadow:inset 0 1px rgba(255,255,255,.12),0 14px 38px rgba(0,0,0,.62),0 0 32px rgba(109,40,217,.12)}
      #crownstore-refresh-splash .splash-mark{display:block;width:62px;height:62px;color:#c4b5fd;filter:drop-shadow(0 0 10px rgba(196,181,253,.32))}
      #crownstore-refresh-splash .splash-wordmark{margin:0;color:#f4efff;font-size:13px;font-weight:700;line-height:1.4;letter-spacing:.16em;text-transform:uppercase}
      #crownstore-refresh-splash .splash-powered{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);margin:0;padding:0 16px;box-sizing:border-box;color:#f4efff;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:.08em;opacity:.72;text-align:center;pointer-events:none}
      #crownstore-refresh-splash .splash-shimmer{position:relative;contain:paint;width:170px;height:3px;margin-top:-7px;overflow:hidden;border-radius:999px;background:rgba(139,92,246,.22);isolation:isolate}
      #crownstore-refresh-splash .splash-shimmer::after{content:"";position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:linear-gradient(90deg,transparent,#c4b5fd,transparent);transform:translate3d(-130%,0,0);backface-visibility:hidden;will-change:transform;animation:crownstore-splash-shimmer 1.15s linear infinite!important;animation-play-state:running!important}
      @keyframes crownstore-splash-shimmer{0%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(240%,0,0)}}
    </style>
  </head>
  <body>
    <div id="crownstore-refresh-splash" role="status" aria-label="CrownStore refreshing">
      <div class="splash-content">
        <div class="splash-logo-circle" aria-hidden="true">
          <svg class="splash-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M4.5 6.5H9L12.2 26.7H29.5L33.2 13.2H13.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.4 14.1 16.7 8.8 21 13.8 25.1 7.8 28.8 13.7 33.1 11.8 29.5 25.1H15.1L13.4 14.1Z" fill="currentColor" fill-opacity=".94" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M17 31.2a1.8 1.8 0 1 0 0 .1M27.7 31.2a1.8 1.8 0 1 0 0 .1" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M16.8 18.1h11.6" stroke="#24133f" stroke-opacity=".72" stroke-width="1.25" stroke-linecap="round"/></svg>
        </div>
        <p class="splash-wordmark">CrownStore</p>
        <div class="splash-shimmer" aria-hidden="true"></div>
      </div>
      <p class="splash-powered">Powered by KingsHall</p>
    </div>
    <script>
      (function () {
        var navigation = performance.getEntriesByType('navigation')[0];
        if (navigation && navigation.type === 'reload') {
          var splash = document.getElementById('crownstore-refresh-splash');
          if (splash) splash.style.display = 'flex';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
