<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0c" />
    <meta name="description" content="Discover, inspect and download official Android applications from the KingsHall ecosystem." />
    <meta name="color-scheme" content="dark" />
    <title>CrownStore — Official KingsHall App Store</title>
    <style>
      #crownstore-refresh-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:#090a0c;color:#f5f1e5}
      #crownstore-refresh-splash .splash-content{display:flex;flex-direction:column;align-items:center;gap:17px;text-align:center}
      #crownstore-refresh-splash .splash-logo-circle{display:grid;place-items:center;width:92px;height:92px;flex:0 0 92px;box-sizing:border-box;border:1px solid rgba(217,182,79,.28);border-radius:50%;background:#050607;box-shadow:0 0 28px rgba(217,182,79,.07),inset 0 1px rgba(255,255,255,.06)}
      #crownstore-refresh-splash .splash-crown{display:block;width:62px;height:62px;color:#e8cf77;filter:drop-shadow(0 0 9px rgba(217,182,79,.13))}
      #crownstore-refresh-splash .splash-wordmark{margin:0;color:#f5f1e5;font-family:'STIX Two Text',Georgia,serif;font-size:13px;font-weight:700;line-height:1.4;letter-spacing:.16em;text-transform:uppercase}
      #crownstore-refresh-splash .splash-shimmer{position:relative;contain:paint;width:170px;height:3px;margin-top:-7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.13);isolation:isolate}
      #crownstore-refresh-splash .splash-shimmer::after{content:"";position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:linear-gradient(90deg,transparent,#e8cf77,transparent);transform:translate3d(-130%,0,0);will-change:transform;animation:crownstore-splash-shimmer 1.1s linear infinite}
      @keyframes crownstore-splash-shimmer{0%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(240%,0,0)}}
      @media(prefers-reduced-motion:reduce){#crownstore-refresh-splash .splash-shimmer::after{animation:none;transform:translateX(70%)}}
    </style>
  </head>
  <body>
    <div id="crownstore-refresh-splash" role="status" aria-label="CrownStore refreshing">
      <div class="splash-content">
        <div class="splash-logo-circle" aria-hidden="true">
          <svg class="splash-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 5 5 5-8 5 8 5-5-2 12H4L2 7Z"/><path d="M4 16h16"/></svg>
        </div>
        <p class="splash-wordmark">CrownStore</p>
        <div class="splash-shimmer" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        var navigation = performance.getEntriesByType('navigation')[0];
        if (navigation && navigation.type === 'reload') {
          var splash = document.getElementById('crownstore-refresh-splash');
          if (splash) splash.style.display = 'flex';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
